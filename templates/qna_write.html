{% extends "base.html" %}
{% block title %}문의 작성 | RTS COSMETIC{% endblock %}
{% block content %}
<section class="sub-hero" style="background-image:url({{ url_for('static', filename='img/hero1.jpg') }})"><p class="en">Q&amp;A</p><h1>문의 작성</h1></section>

<section class="sec">
  <div class="wrap">
    {% if error %}<p class="notice err" role="alert">{{ error }}</p>{% endif %}
    <form method="post" class="form">
      <label>이름 *<input name="name" maxlength="30" required value="{{ form.name }}"></label>
      <label>비밀번호 (선택)<input name="password" type="password" maxlength="50" autocomplete="new-password" placeholder="입력하면 비밀글로 등록됩니다"></label>
      <label class="full">제목 *<input name="title" maxlength="100" required value="{{ form.title }}"></label>
      <label class="full">내용 *<textarea name="body" rows="10" maxlength="3000" required>{{ form.body }}</textarea></label>
      <input class="hp" name="website" tabindex="-1" autocomplete="off" aria-hidden="true">
      <p class="full hint">비밀번호를 비워 두면 누구나 볼 수 있는 공개글이 됩니다. 비밀글은 설정한 비밀번호로만 열람할 수 있으니 잊지 않도록 해주세요.</p>
      <a class="btn ghost" href="{{ url_for('qna') }}">목록</a>
      <button class="btn">등록하기</button>
    </form>
  </div>
</section>
{% endblock %}
